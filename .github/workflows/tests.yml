name: Tests

on:
  push:
    branches: ["**"]   # tags are tested by the release workflow
  pull_request:
  workflow_call:       # reused by release.yml

jobs:
  unit-tests:
    name: Unit tests (Python 3.9, oldest supported)
    runs-on: ubuntu-latest
    container: python:3.9-slim
    steps:
      - uses: actions/checkout@v4
      - run: python --version
      - run: python -m unittest discover -v tests
